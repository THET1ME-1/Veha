name: veha
description: "Veha — local-first календарь для Android в стиле Material 3 Expressive."
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Дизайн-ДНК: тема, шрифты, базовые виджеты. Только git-зависимостью —
  # копия разъезжается с остальными приложениями, это уже проходили.
  m3_dna:
    git:
      url: https://github.com/THET1ME-1/m3-dna.git

  # Состояние
  flutter_riverpod: ^2.6.1

  # База
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  path_provider: ^2.1.4
  path: ^1.9.0

  # Повторения и время
  rrule: ^0.2.16
  timezone: ^0.9.4
  intl: any

  # Цвет и иконки
  dynamic_color: ^1.7.0
  material_color_utilities: any

  # Прочее
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  collection: ^1.18.0
  package_info_plus: ^8.3.0
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.1.0
  file_picker: ^8.3.7
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  http: ^1.6.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Только ради шрифта иконок: tool/build_icon_font.py берёт из пакета
  # вариативный Material Symbols Rounded и режет его по белому списку.
  # В сборку приложения пакет не попадает.
  material_symbols_icons: ^4.2801.0
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    # Собственный набор иконок: 61 глиф, 13 КБ. Собирается скриптом
    # tool/build_icon_font.py, список — в lib/core/icon_registry.dart.
    - family: VehaSymbols
      fonts:
        - asset: assets/fonts/VehaSymbols.ttf
